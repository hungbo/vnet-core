        type: string
      is_default:
        type: boolean
      name:
        type: string
      port:
        type: integer
      printer_type:
        type: string
    type: object
  service.UpdateProductIngredientRequest:
    properties:
      quantity:
        type: number
    type: object
  service.UpdateProductRequest:
    properties:
      category_id:
        type: string
      current_stock:
        type: number
      description:
        type: string
      has_stock:
        type: boolean
      image_url:
        type: string
      is_active:
        type: boolean
      is_retail:
        type: boolean
      min_stock:
        type: number
      name:
        maxLength: 200
        type: string
      options:
        items:
          $ref: '#/definitions/service.ProductOptionItem'
        type: array
      price:
        description: |-
          omitempty là bắt buộc với con trỏ: thiếu nó thì validator coi nil là vi
          phạm min=0, nên MỌI lần cập nhật một phần không kèm giá đều bị chặn bằng
          câu "Giá tối thiểu là 0" — sửa mỗi nhà cung cấp của sản phẩm cũng hỏng.
          Cả repo đang dùng khuôn `omitempty,min=...`, đây là chỗ duy nhất lệch.
        minimum: 0
        type: integer
      sort_order:
        type: integer
      supplier_id:
        type: string
      unit_id:
        type: string
    type: object
  service.UpdatePromotionRequest:
    properties:
      conditions:
        items:
          $ref: '#/definitions/service.CreatePromotionCondition'
        type: array
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      priority:
        type: integer
      rewards:
        items:
          $ref: '#/definitions/service.CreatePromotionReward'
        type: array
      type:
        type: string
      valid_from:
        description: |-
          RawMessage thay vì *string để phân biệt "không gửi" (giữ nguyên) với
          null hoặc "" (xoá mốc ngày). Với *string cả hai đều ra nil, nên một khuyến
          mãi đã đặt ngày hết hạn không bao giờ bỏ hạn được nữa.
        type: string
      valid_to:
        type: string
    type: object
  service.UpdateRoleRequest:
    properties:
      id:
        type: string
      roleCode:
        type: string
      roleDesc:
        description: Con trỏ để xoá trống được mô tả; chuỗi thường thì "" bị coi là
          "không gửi".
        type: string
      roleName:
        type: string
      status:
        type: string
    type: object
  service.UpdateStatusRequest:
    properties:
      status:
        type: string
    type: object
  service.UpdateSupplierRequest:
    properties:
      address:
        type: string
      email:
        type: string
