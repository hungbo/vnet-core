    type: object
  service.UpdateItemStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  service.UpdateMachineAssetRequest:
    properties:
      asset_type:
        type: string
      brand:
        type: string
      check_photos:
        items:
          type: string
        type: array
      machine_id:
        description: |-
          Chuyển thiết bị sang máy khác. Form sửa cho chọn máy nhưng trước đây
          request không nhận trường này nên đổi máy báo thành công mà không đổi gì.
        type: string
      model:
        type: string
      notes:
        type: string
      serial:
        type: string
      status:
        type: string
    type: object
  service.UpdateMachineGroupRequest:
    properties:
      color:
        type: string
      description:
        type: string
      name:
        type: string
      price_per_hour:
        type: integer
      sort_order:
        type: integer
    type: object
  service.UpdateMachineRequest:
    properties:
      cpu_name:
        type: string
      gpu_name:
        type: string
      group_id:
        type: string
      is_active:
        description: |-
          IsActive là công tắc tạm ngừng máy, và là ĐƯỜNG THAY CHO VIỆC XOÁ.

          Máy đã có phiên chơi, đơn hàng hay lịch đặt thì không xoá được nữa (xem
          Delete bên dưới): lịch sử phải giữ lại. Không có công tắc này thì quản trị
          viên muốn ngừng một máy hỏng chỉ còn cách xoá — đúng thao tác nguy hiểm
          nhất trong service này.

          StartSession lọc "is_active = true" (session.go), nên đặt false là chặn
          mở phiên mới ngay lập tức. List KHÔNG lọc cột này, nên máy đã tắt vẫn hiện
          trên trang quản trị để bật lại được.

          Con trỏ vì đây là bản vá từng phần: bỏ trống nghĩa là không đổi.
        type: boolean
      os_info:
        type: string
      ram_gb:
        type: integer
      status:
        description: |-
          Ba trạng thái, không hơn.

          omitempty vì đây là bản vá từng phần: bỏ trống nghĩa là không đổi trạng
          thái, và oneof chỉ chạy khi có giá trị. Không có ràng buộc này thì
          {"status":"abcxyz"} ghi thẳng vào cột: máy đó rơi ra ngoài mọi phép so
          sánh — không bị chặn mở phiên vì nó không phải "in_use", và trang quản
          trị hiện chuỗi thô vì không có nhãn nào khớp.

          "maintenance" từng nằm trong danh sách nhưng chưa bao giờ là trạng thái
          thật: không dòng code nào đặt hay đọc nó, chỉ có một nhãn trên giao diện.
        enum:
        - offline
        - available
        - in_use
        type: string
      storage_gb:
        type: integer
    type: object
  service.UpdateMemberRequest:
    properties:
      avatar_url:
        type: string
      date_of_birth:
        $ref: '#/definitions/utils.JSONDate'
      email:
        type: string
      full_name:
        type: string
      group_id:
        type: string
