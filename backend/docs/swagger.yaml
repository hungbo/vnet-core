  service.TopupRequest:
    properties:
      amount:
        type: integer
      description:
        type: string
      idempotency_key:
        description: |-
          IdempotencyKey do phía gọi sinh ra. Gửi lại cùng một khoá nghĩa là cùng
          MỘT ý định, không phải hai lần thao tác. Bỏ trống là không tham gia.
        type: string
      payment_method:
        description: |-
          Chốt ca đếm tiền mặt bằng cách lọc đúng chuỗi "cash". Để trường này tự do
          thì một giá trị gõ sai làm khoản tiền mặt đó biến mất khỏi số tiền phải có
          trong két — két thừa mà không ai truy ra vì sao. Topup kiểm nó với danh
          sách ở Cài đặt > Thanh toán, cộng "bonus_balance" là đường nội bộ để tặng
          số dư.
        type: string
    required:
    - payment_method
    type: object
  service.TransactionLogRow:
    properties:
      amount:
        type: integer
      balance_after:
        type: integer
      balance_before:
        type: integer
      bonus_after:
        type: integer
      bonus_before:
        type: integer
      created_at:
        type: string
      created_by:
        type: string
      created_by_name:
        type: string
      description:
        type: string
      id:
        type: string
      member_id:
        type: string
      member_name:
        type: string
      member_username:
        type: string
      payment_method:
        type: string
      transaction_type:
        type: string
    type: object
  service.UnitResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  service.UpdateBookingRequest:
    properties:
      booked_from:
        type: string
      booked_to:
        type: string
      customer_name:
        type: string
      customer_phone:
        type: string
      deposit_amount:
        type: integer
      notes:
        type: string
    type: object
  service.UpdateCategoryRequest:
    properties:
      icon:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      parent_id:
        type: string
      printer_id:
        type: string
      sort_order:
        type: integer
    type: object
  service.UpdateComboRequest:
    properties:
      apply_days:
        items:
          type: integer
        type: array
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        minimum: 0
        type: integer
      slot_end:
        type: string
      slot_start:
        type: string
      total_minutes:
        type: integer
      type:
        enum:
        - fixed_slot
        - prepaid
        type: string
      validity_days:
        minimum: 0
        type: integer
    type: object
  service.UpdateCurfewRequest:
    properties:
      curfew_end:
        type: string
      curfew_start:
        type: string
      day_of_week:
        maximum: 6
        minimum: 0
        type: integer
      is_active:
        type: boolean
      max_minor_hours:
        type: integer
