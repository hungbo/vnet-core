          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Trạng thái điểm danh hôm nay và chuỗi ngày
      tags:
      - Attendance
  /api/audit-logs:
    get:
      consumes:
      - application/json
      description: Get a paginated list of audit logs
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PaginatedData'
                  - properties:
                      data:
                        items:
                          $ref: '#/definitions/model.AuditLog'
                        type: array
                    type: object
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - AuditLogs
  /api/audit-logs/{id}:
    get:
      consumes:
      - application/json
      description: Get a single audit log entry
      parameters:
      - description: Audit log ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
