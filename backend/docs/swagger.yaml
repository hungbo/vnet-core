paths:
  /admin/notifications:
    get:
      consumes:
      - application/json
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PaginatedData'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/service.NotificationResponse'
                        type: array
                    type: object
              type: object
      security:
      - BearerAuth: []
      summary: List admin notifications
      tags:
      - Admin Notifications
    post:
      consumes:
      - application/json
      parameters:
      - description: Notification data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CreateNotificationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.NotificationResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create notification
      tags:
      - Admin Notifications
  /admin/notifications/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: còn dữ liệu phụ thuộc
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Delete notification
      tags:
      - Admin Notifications
    get:
      consumes:
      - application/json
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.NotificationResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get notification by ID
      tags:
      - Admin Notifications
    put:
      consumes:
      - application/json
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      - description: Notification update data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.UpdateNotificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.NotificationResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Update notification
      tags:
      - Admin Notifications
  /admin/notifications/{id}/dispatch:
    post:
      consumes:
      - application/json
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: integer
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: Dispatch notification to all members
      tags:
      - Admin Notifications
  /api/app-updates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Danh sách bản cập nhật đã công bố
      tags:
      - AppUpdates
    post:
      consumes:
