        tải về.'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Response'
      summary: Công bố một bản cập nhật
      tags:
      - AppUpdates
  /api/app-updates/{id}:
    delete:
      parameters:
      - description: Update ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: còn dữ liệu phụ thuộc
          schema:
            $ref: '#/definitions/response.Response'
      summary: Xoá một bản cập nhật
      tags:
      - AppUpdates
