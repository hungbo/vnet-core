        type: string
      userGender:
        type: string
      userName:
        type: string
      userPhone:
        type: string
      userRoles:
        items:
          type: string
        type: array
    type: object
  service.UserManageResponse:
    properties:
      createBy:
        type: string
      createTime:
        type: string
      id:
        type: string
      lastLoginTime:
        description: |-
          last_login_at ĐƯỢC ghi ở AuthService.Login nhưng chưa API nào trả ra, nên
          không cách nào biết tài khoản nào lâu rồi không ai dùng.
        type: string
      nickName:
        type: string
      status:
        type: string
      updateBy:
        type: string
      updateTime:
        type: string
      userEmail:
        type: string
      userGender:
        type: string
      userName:
        type: string
      userPhone:
        type: string
      userRoles:
        items:
          type: string
        type: array
    type: object
  service.UserResponse:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      kind:
        description: |-
          Kind: "staff" hoặc "member", lấy từ chính token. Máy trạm dùng nó khi khôi
          phục đăng nhập để biết dựng màn hình nào, thay vì tin giá trị tự lưu.
        type: string
      must_change_password:
        description: |-
          Luôn có mặt (không omitempty): giao diện gộp user này vào state hiện có, nên
          thiếu trường thì cờ true của lần đăng nhập trước còn nguyên sang tài khoản sau.
        type: boolean
      permissions:
        items:
          type: string
        type: array
      phone:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  service.WakeResult:
    properties:
      mac_address:
        type: string
      machine_code:
        type: string
      targets:
        items:
          type: string
        type: array
    type: object
  utils.JSONDate:
    properties:
      time:
        type: string
