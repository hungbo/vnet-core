basePath: /api
definitions:
  model.AuditLog:
    properties:
      action:
        type: string
      created_at:
        type: string
      description:
        type: string
      entity_id:
        description: |-
          Con trỏ chứ không phải string: cột là uuid, và PostgreSQL từ chối chuỗi
          rỗng làm uuid. Trước đây mọi bản ghi không gắn với một thực thể cụ thể
          (đổi cài đặt, sinh lô thẻ, nạp thẻ hụt) đều bị từ chối trong im lặng.
        type: string
      entity_type:
        type: string
      id:
        type: string
      ip_address:
        type: string
      metadata:
        type: string
      user_id:
        type: string
    type: object
  model.BackupLog:
    properties:
      completed_at:
        type: string
      created_by:
        type: string
      file_name:
        type: string
      file_path:
        type: string
      file_size:
        type: integer
      id:
        type: string
      notes:
        type: string
      started_at:
        type: string
      status:
        type: string
    type: object
  model.Machine:
    properties:
      booted_at:
        description: |-
          Thời điểm máy khởi động lần gần nhất, suy ra từ uptime trong heartbeat.
          Trên máy đóng băng (diskless), reboot làm giá trị này nhảy về hiện tại;
          phiên nào bắt đầu TRƯỚC mốc này là phiên còn sót từ trước khi reboot.
        type: string
      cpu_name:
        type: string
      cpu_temp:
        type: number
      created_at:
        type: string
      deleted_at:
        type: string
      extra_network:
        type: string
      gpu_name:
        type: string
      gpu_temp:
        type: number
      group_id:
        type: string
      id:
        type: string
      ip_address:
        type: string
      is_active:
        type: boolean
      last_heartbeat:
        type: string
      mac_address:
        type: string
      machine_code:
        type: string
      os_info:
        type: string
      peripherals:
        description: |-
          Thiết bị ngoại vi máy trạm tự đọc lúc khởi động: màn hình, bàn phím,
          chuột, âm thanh. Mỗi dòng dạng "Màn hình: Samsung S24F350 (serial)".
        items:
          type: string
        type: array
      ram_gb:
        type: integer
      status:
        type: string
      storage_gb:
        type: integer
      updated_at:
        type: string
      user_is_admin:
        description: |-
          Hai dấu hiệu máy trạm tự báo để trang Máy cảnh báo chủ quán.
          UserIsAdmin: tài khoản Windows đang đăng nhập có quyền quản trị — khi đó
          người ngồi máy gỡ được mọi lớp bảo vệ của máy trạm.
          ExtraNetwork: card mạng xuất hiện SAU khi máy khởi động (Wi-Fi, USB phát
          mạng), dạng "tên (IP)". Rỗng là không có.
        type: boolean
    type: object
  model.MachineAsset:
    properties:
      asset_type:
        type: string
      brand:
        type: string
      check_photos:
        items:
          type: string
        type: array
      checked_at:
        type: string
      checked_by:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      machine_id:
        type: string
      model:
        type: string
      notes:
        type: string
      serial:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  model.MachineGroup:
    properties:
      color:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price_per_hour:
        type: integer
      sort_order:
        type: integer
    type: object
  model.MachineHardwareSnapshot:
    properties:
      cpu_temp:
        type: number
      cpu_usage:
        type: number
      created_at:
        description: |-
          Có chỉ mục vì hai đường đọc đều đi qua cột này: bảng nhật ký sắp theo
          thời gian giảm dần, và tác vụ dọn dẹp xoá theo mốc thời gian. Không có
          chỉ mục thì cả hai quét toàn bảng — mà đây là bảng lớn nhất hệ thống.
        type: string
      disk_usage:
        type: number
      gpu_temp:
        type: number
      id:
        type: string
      machine_id:
        type: string
      ram_usage:
        type: number
      uptime:
        description: |-
          Số giây máy đã bật. Máy trạm vẫn gửi lên từ trước nhưng không có cột nào
          nhận, nên con số rơi vào hư không ở mỗi lần báo.
        type: integer
    type: object
  model.Permission:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: string
      module:
        type: string
      name:
        type: string
    type: object
  response.PaginatedData:
    properties:
      items: {}
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  service.ActivateComboRequest:
    properties:
      machine_id:
        type: string
    required:
    - machine_id
    type: object
  service.AllRoleResponse:
    properties:
      id:
        type: string
      roleCode:
        type: string
      roleName:
        type: string
    type: object
  service.BatchCreateMachinesRequest:
    properties:
      cpu_name:
        description: |-
          Cấu hình áp chung cho cả lô. Máy trạm sẽ ghi đè bằng số đo thật ở nhịp
          tim đầu tiên, nên đây chỉ là giá trị tạm để nhìn cho có.
        type: string
      digits:
        maximum: 10
        minimum: 0
        type: integer
      dry_run:
        description: |-
          DryRun chỉ kiểm rồi trả kết quả, không ghi gì. Giao diện gọi trước khi
          tạo thật để báo trước có tạo được hay không.
        type: boolean
      from:
        minimum: 0
        type: integer
      gpu_name:
        type: string
      group_id:
        type: string
      os_info:
        type: string
      prefix:
        type: string
      ram_gb:
        type: integer
      storage_gb:
        type: integer
      to:
        minimum: 0
        type: integer
    required:
    - prefix
    type: object
  service.BatchCreateResult:
    properties:
      codes:
        items:
          type: string
        type: array
      conflicts:
        description: Conflicts là mã đã có máy đang dùng.
        items:
          type: string
        type: array
      created:
        type: integer
      deleted:
        description: |-
          Deleted là mã thuộc về máy ĐÃ XOÁ. Tách riêng khỏi Conflicts vì người
          dùng không thấy chúng ở đâu trên màn hình: machine_code có unique index
          thường (không phải partial theo deleted_at), nên máy xoá mềm vẫn giữ mã
          và vẫn chặn mã đó. Gộp chung hai loại thì thông điệp thành "PC-05 đã tồn
          tại" trong khi danh sách máy không có PC-05 nào.
        items:
          type: string
        type: array
      dry_run:
        type: boolean
    type: object
  service.BookingResponse:
    properties:
      booked_from:
        type: string
      booked_to:
        type: string
      cancel_at:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      customer_name:
        type: string
      customer_phone:
        type: string
      deposit_amount:
        type: integer
      deposit_transaction_id:
        type: string
      id:
        type: string
      machine_code:
        description: |-
          Cột "Mã máy" trên trang Đặt chỗ đọc trường này. Không trả về thì ô đó
          luôn trống, và câu xác nhận check-in thành "tại máy ." — nhân viên không
          biết đang giữ máy nào.
        type: string
      machine_id:
        type: string
      member_id:
        type: string
      notes:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  service.ByEmployeeRow:
    properties:
      employee_id:
        type: string
      employee_name:
        type: string
      orders_taken:
        type: integer
      total_sales:
        type: integer
    type: object
  service.ByMachineRow:
    properties:
      machine_code:
        description: |-
          Máy không có tên riêng, chỉ có mã (model.Machine). Trường cũ tên
          machine_name khiến giao diện dựng hai cột "Máy" và "Tên máy" trong đó một
          cột luôn trống.
        type: string
      machine_id:
        type: string
      session_count:
        type: integer
      total_sales:
        type: integer
      usage_hours:
        type: number
    type: object
  service.ByMemberRow:
    properties:
      member_id:
        type: string
      member_name:
        type: string
      total_spent:
        type: integer
      visit_count:
        type: integer
    type: object
  service.CashHandoverResponse:
    properties:
      amount:
        type: integer
      created_at:
        type: string
      handover_type:
        type: string
      id:
        type: string
      reason:
        type: string
      shift_id:
        type: string
    type: object
  service.CategoryResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/service.CategoryResponse'
        type: array
      created_at:
        type: string
      icon:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      parent_id:
        type: string
      printer_id:
        type: string
      sort_order:
        type: integer
    type: object
  service.ChangePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  service.ClientLoginResponse:
    properties:
      access_token:
        type: string
      kind:
        description: |-
          "staff" hoặc "member". Máy trạm cần biết để dựng đúng màn hình: nhân viên
          vào máy thì không mở phiên và không tính tiền.
        type: string
      refresh_token:
        type: string
      session_id:
        type: string
      user:
        $ref: '#/definitions/service.UserResponse'
    type: object
  service.CloseShiftRequest:
    properties:
      closing_balance:
        description: |-
          Đóng ca với két rỗng là hợp lệ, nên 0 phải được chấp nhận — vì thế là con
          trỏ: thiếu hẳn trường thì phải báo lỗi chứ không ngầm hiểu là két rỗng.
        minimum: 0
        type: integer
      notes:
        type: string
    required:
    - closing_balance
    type: object
  service.ComboPurchaseResponse:
    properties:
      activated:
        type: boolean
      activated_at:
        type: string
      combo_id:
        type: string
      combo_name:
        type: string
      created_at:
        type: string
      current_session_id:
        type: string
      expires_at:
        type: string
      generated_password:
        type: string
      id:
        type: string
      member_id:
        type: string
      member_username:
        description: |-
          MemberUsername chỉ có khi vừa mua: mã tài khoản khách để quầy tra lại gói
          trong "Combo đã mua" lúc kích hoạt.
        type: string
      payment_method:
        type: string
      price:
        type: integer
      remaining_minutes:
        type: integer
    type: object
  service.ComboResponse:
    properties:
      apply_days:
        items:
          type: integer
        type: array
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      member_count:
        type: integer
      member_prefix:
        type: string
      name:
        type: string
      price:
        type: integer
      slot_end:
        type: string
      slot_start:
        type: string
      total_minutes:
        type: integer
      type:
        type: string
      validity_days:
        type: integer
    type: object
  service.CostBreakdown:
    properties:
      billed_minutes:
        type: integer
      discount_amount:
        type: integer
      discount_percent:
        type: number
      duration_minutes:
        type: integer
      final_cost:
        type: integer
      gross_cost:
        type: integer
      machine_group_name:
        type: string
      no_pricing:
        description: |-
          NoPricing bật khi máy không tra ra được giá nào (chưa gán nhóm, hoặc nhóm
          để giá 0). Phiên vẫn mở được — có quán cố ý để máy miễn phí — nhưng quầy
          phải nhìn thấy điều đó trước khi bấm, không phải phát hiện lúc cuối tháng
          thấy doanh thu hụt.
        type: boolean
      price_per_hour:
        type: integer
    type: object
  service.CountLineRequest:
    properties:
      actual_qty:
        minimum: 0
        type: number
      note:
        type: string
      product_id:
        type: string
    required:
    - product_id
    type: object
  service.CreateBackupRequest:
    properties:
      created_by:
        type: string
      notes:
        type: string
    type: object
  service.CreateBookingRequest:
    properties:
      booked_from:
        type: string
      booked_to:
        type: string
      customer_name:
        type: string
      customer_phone:
        type: string
      deposit_amount:
        type: integer
      idempotency_key:
        description: |-
          IdempotencyKey do phía gọi sinh ra. Gửi lại cùng một khoá nghĩa là cùng
          MỘT ý định, không phải hai lần thao tác. Bỏ trống là không tham gia.
        type: string
      machine_id:
        type: string
      member_id:
        type: string
      notes:
        type: string
    required:
    - booked_from
    - booked_to
    - customer_name
    - customer_phone
    - machine_id
    type: object
  service.CreateCategoryRequest:
    properties:
      icon:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      parent_id:
        type: string
      printer_id:
        type: string
      sort_order:
        type: integer
    required:
    - name
    type: object
  service.CreateComboRequest:
    properties:
      apply_days:
        items:
          type: integer
        type: array
      description:
        type: string
      is_active:
        description: 'Con trỏ: không gửi = bật như trước nay; gửi false = tạo ở trạng
          thái tắt.'
        type: boolean
      name:
        type: string
      price:
        description: required và min=0 mâu thuẫn nhau; gói miễn phí là hợp lệ.
        minimum: 0
        type: integer
      slot_end:
        type: string
      slot_start:
        type: string
      total_minutes:
        type: integer
      type:
        enum:
        - fixed_slot
        - prepaid
        type: string
      validity_days:
        type: integer
    required:
    - name
    - type
    type: object
  service.CreateCurfewRequest:
    properties:
      curfew_end:
        type: string
      curfew_start:
        type: string
      day_of_week:
        description: Chủ nhật là 0; "required" sẽ coi đó là thiếu dữ liệu nên chỉ
          dùng min/max.
        maximum: 6
        minimum: 0
        type: integer
      is_active:
        type: boolean
      max_minor_hours:
        description: |-
          Con trỏ: không gửi = mặc định của cột (2 giờ, bật); gửi 0 / false thì
          phải ra đúng 0 / tắt.
        minimum: 0
        type: integer
    required:
    - curfew_end
    - curfew_start
    type: object
  service.CreateFeedbackRequest:
    properties:
      content:
        type: string
      machine_id:
        description: Chỉ nhân viên gửi hộ mới được chỉ định máy; hội viên tự gửi thì
          bỏ qua.
        type: string
      order_id:
        type: string
      rating:
        description: |-
          1–5. Không dùng "required" vì validator coi 0 là thiếu dữ liệu; min=1 đã
          loại 0 rồi mà thông báo lỗi lại đúng nghĩa hơn.
        maximum: 5
        minimum: 1
        type: integer
    type: object
  service.CreateGroupRequest:
    properties:
      discount_percent:
        maximum: 100
        minimum: 0
        type: number
      is_default:
        type: boolean
      min_spent:
        minimum: 0
        type: integer
      name:
        type: string
    type: object
  service.CreateMachineAssetRequest:
    properties:
      asset_type:
        type: string
      brand:
        type: string
      check_photos:
        description: |-
          Ảnh chụp lúc kiểm tra. Trường này có trong model từ đầu nhưng request
          không hề nhận nó, nên chưa bao giờ lưu được ảnh nào.
        items:
          type: string
        type: array
      machine_id:
        type: string
      model:
        type: string
      notes:
        type: string
      serial:
        type: string
      status:
        type: string
    required:
    - asset_type
    - machine_id
    type: object
  service.CreateMachineGroupRequest:
    properties:
      color:
        type: string
      description:
        type: string
      name:
        type: string
      price_per_hour:
        type: integer
      sort_order:
        type: integer
    required:
    - name
    type: object
  service.CreateMachineRequest:
    properties:
      cpu_name:
        type: string
      gpu_name:
        type: string
      group_id:
        type: string
      machine_code:
        type: string
      os_info:
        type: string
      ram_gb:
        type: integer
      storage_gb:
        type: integer
    required:
    - machine_code
    type: object
  service.CreateMemberRequest:
    properties:
      date_of_birth:
        $ref: '#/definitions/utils.JSONDate'
      email:
        type: string
      full_name:
        type: string
      group_id:
        type: string
      id_card_image_url:
        description: |-
          Hai đường dẫn ảnh dưới đây lưu được nhưng trước nay KHÔNG DTO nào nhận,
          nên cột luôn rỗng. Giấy đồng ý của phụ huynh gắn thẳng với giới nghiêm:
          không có nó thì quán không chứng minh được vì sao cho trẻ vị thành niên
          ngồi máy.
        type: string
      id_card_number:
        type: string
      is_active:
        type: boolean
      notes:
        type: string
      parent_consent_file_url:
        type: string
      password:
        type: string
      phone:
        type: string
      username:
        type: string
    type: object
  service.CreateNotificationRequest:
    properties:
      content:
        type: string
      title:
        type: string
      type:
        type: string
    required:
    - title
    - type
    type: object
  service.CreateOrderRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/service.OrderItemRequest'
        type: array
      machine_code:
        type: string
      machine_id:
        type: string
      member_id:
        type: string
      note:
        type: string
      table_number:
        type: string
    type: object
  service.CreatePrinterRequest:
    properties:
      chars_per_line:
        type: integer
      code_page:
        type: integer
      encoding:
        type: string
      ip_address:
        description: |-
          Địa chỉ phải là IP hoặc tên máy hợp lệ: chuỗi bất kỳ vẫn lưu được, và
          người trực chỉ phát hiện ra lúc bấm In thử — hoặc tệ hơn, lúc bếp không
          nhận được phiếu giữa giờ cao điểm.
        type: string
      is_default:
        type: boolean
      name:
        type: string
      port:
        type: integer
      printer_type:
        type: string
    required:
    - name
    - printer_type
    type: object
  service.CreateProductIngredientRequest:
    properties:
      ingredient_id:
        type: string
      quantity:
        type: number
      unit_id:
        type: string
    required:
    - ingredient_id
    type: object
  service.CreateProductRequest:
    properties:
      category_id:
        type: string
      current_stock:
        type: number
      description:
        type: string
      has_stock:
        type: boolean
      image_url:
        type: string
      is_active:
        type: boolean
      is_retail:
        type: boolean
      min_stock:
        type: number
      name:
        maxLength: 200
        type: string
      options:
        items:
          $ref: '#/definitions/service.ProductOptionItem'
        type: array
      price:
        minimum: 0
        type: integer
      sort_order:
        type: integer
      supplier_id:
        type: string
      unit_id:
        type: string
    required:
    - name
    type: object
  service.CreatePromotionCondition:
    properties:
      condition_key:
        type: string
      condition_value:
        type: object
    required:
    - condition_key
    - condition_value
    type: object
  service.CreatePromotionRequest:
    properties:
      conditions:
        items:
          $ref: '#/definitions/service.CreatePromotionCondition'
        type: array
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      priority:
        type: integer
      rewards:
        items:
          $ref: '#/definitions/service.CreatePromotionReward'
        type: array
      type:
        type: string
      valid_from:
        type: string
      valid_to:
        type: string
    required:
    - name
    - type
    type: object
